name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # Ruby version comes from .ruby-version
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Shrink images and strip photo metadata (GPS, camera info)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl imagemagick
          if [ -d _site/assets/images ]; then
            find _site/assets/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) \
              -exec mogrify -resize '1600x1600>' -quality 82 {} +
            exiftool -r -overwrite_original -all= -tagsfromfile @ -Orientation -ICC_Profile \
              -ext jpg -ext jpeg -ext png -ext webp -ext heic _site/assets/images
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
