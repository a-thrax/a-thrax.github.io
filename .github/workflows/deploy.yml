name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the cleaned images back to main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Shrink images and strip photo metadata (GPS, camera info) in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main # include uploads that landed while this run was queued
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl imagemagick optipng
          find assets/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 |
            while IFS= read -r -d '' f; do
              read -r w h q < <(identify -format '%w %h %Q\n' "$f[0]")
              big=$(( w > 1600 || h > 1600 ))
              case "${f,,}" in
                *.jpg|*.jpeg) if [ "$big" = 1 ] || [ "$q" -gt 85 ]; then mogrify -resize '1600x1600>' -quality 82 "$f"; fi ;;
                *.webp)       if [ "$big" = 1 ]; then mogrify -resize '1600x1600>' -quality 82 "$f"; fi ;;
                *.png)        if [ "$big" = 1 ]; then mogrify -resize '1600x1600>' "$f"; fi
                              optipng -quiet -o2 "$f" ;;
              esac
            done
          exiftool -r -overwrite_original -all= -tagsfromfile @ -Orientation -ICC_Profile \
            -ext jpg -ext jpeg -ext png -ext webp assets/images
          if [ -n "$(git status --porcelain assets/images)" ]; then
            git add assets/images
            git commit -m "Optimize images and strip metadata"
            git push origin HEAD:main
          fi
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # Ruby version comes from .ruby-version
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
