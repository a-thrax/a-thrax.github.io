{% assign post = include.post %}
{% assign topic = site.topics | where: "slug", post.topic | first %}
<article class="article-card">
  <div class="article-meta">
    {% if topic %}<span>{{ topic.name }}</span>{% endif %}
    <span>{{ post.date | date: "%d/%m/%Y" }}</span>
  </div>
  <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
  <p>{{ post.excerpt | strip_html | strip_newlines | truncatewords: 26 }}</p>
  <a class="article-read" href="{{ post.url | relative_url }}">Διάβασε →</a>
</article>
