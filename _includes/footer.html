<footer>
    <div>
        <strong>{{ site.title }}</strong>
        <span>{{ site.tagline }}</span>
    </div>
    <nav class="footer-social">
        {% for link in site.social.links %}{% unless link contains "TODO" %}
        <a href="{{ link }}" target="_blank" rel="me noopener">{% if link contains "facebook" %}Facebook{% elsif link contains "instagram" %}Instagram{% else %}{{ link }}{% endif %}</a>
        {% endunless %}{% endfor %}
        <span>© <span>{{ site.time | date: "%Y" }}</span></span>
    </nav>
    <script defer src="https://cloud.umami.is/script.js"
            data-website-id="459ec399-e8d0-4518-8742-b27a0f04f1d4"></script>
</footer>
