<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ "/" | relative_url }}">
      <img class="brand-mark" src="{{ "/assets/logo.png" | relative_url }}" alt="">

      <span>
        <strong>{{ site.title }}</strong>
        <small>{{ site.tagline }}</small>
      </span>
    </a>

    <nav class="main-nav" aria-label="Κύρια πλοήγηση">
      {% for topic in site.topics %}
      <a href="{{ "/" | append: topic.slug | append: "/" | relative_url }}">{{ topic.name }}</a>
      {% endfor %}
      <a href="{{ "/about/" | relative_url }}">Σχετικά</a>
    </nav>

    <button class="menu-btn" id="menuBtn" aria-label="Άνοιγμα μενού">☰</button>
  </div>
</header>
