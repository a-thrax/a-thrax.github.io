media:
  input: assets/images
  output: /assets/images
  extensions: [jpg, jpeg, png, webp]
  rename: safe   # slugify uploaded filenames (no spaces, apostrophes or Greek letters)

content:
  - name: posts
    label: Άρθρα
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{fields.slug}.md"
    view:
      fields: [title, topic, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: layout, type: string, hidden: true, default: post }
      - { name: title, label: Τίτλος, type: string, required: true }
      - name: slug
        label: Σύντομο όνομα URL (αγγλικά, με παύλες)
        type: string
        required: true
        pattern: { regex: "^[a-z0-9-]+$", message: "Μόνο λατινικά πεζά, αριθμοί και παύλες" }
      - name: topic
        label: Κατηγορία
        type: reference
        required: true
        options:
          collection: topics
          search: name
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: date
        label: Ημερομηνία δημοσίευσης
        type: date
        options:
          time: true
          format: yyyy-MM-dd HH:mm
      - name: excerpt
        label: Περίληψη
        description: Εμφανίζεται στις κάρτες, στη Google και στην προεπισκόπηση Facebook/Viber. Έως ~160 χαρακτήρες.
        type: text
        options: { maxlength: 160 }
      - { name: body, label: Κείμενο, type: rich-text }

  - name: topics
    label: Κατηγορίες
    type: collection
    path: _topics
    filename: "{fields.slug}.md"
    view:
      fields: [name, slug]
    fields:
      - { name: name, label: Όνομα, type: string, required: true }
      - name: slug
        label: Σύντομο όνομα URL (αγγλικά, με παύλες)
        description: Μην το αλλάξετε αφού υπάρχουν άρθρα σε αυτή την κατηγορία.
        type: string
        required: true
        pattern: { regex: "^[a-z0-9-]+$", message: "Μόνο λατινικά πεζά, αριθμοί και παύλες" }
      - { name: desc, label: Περιγραφή, type: string }
      - { name: order, label: Σειρά στο μενού, type: number, default: 10 }
      - name: featured
        label: Κύρια ενότητα (αρχική σελίδα & «Τελευταία κείμενα»)
        description: Μόνο μία κατηγορία πρέπει να το έχει επιλεγμένο. Τα άρθρα της εμφανίζονται στην αρχική και στο /articles/ αντί για το μενού.
        type: boolean
        default: false

  - name: quotes
    label: Ατάκες
    type: collection
    path: _quotes
    filename: "{year}-{month}-{day}-{hour}{minute}.md"
    view:
      fields: [body, date]
      default:
        sort: date
        order: desc
    fields:
      - name: date
        label: Ημερομηνία
        description: Η πιο πρόσφατη ατάκα εμφανίζεται στην αρχική ως «Η ατάκα της ημέρας».
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd HH:mm
      - { name: author, label: Ποιος το είπε (προαιρετικό), type: string }
      - { name: body, label: Ατάκα, type: text, required: true }

  - name: home
    label: Αρχική σελίδα
    type: file
    path: _data/home.yml
    fields:
      - { name: recent_count, label: Πόσα άρθρα στα «Πρόσφατα», type: number, default: 5 }
